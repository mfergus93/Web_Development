<!DOCTYPE HTML>
<html lang="en">
	<head>
		<title>Just for Fun | Matt Ferguson</title>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="description" content="Small interactive experiments by Matt Ferguson, including the fictional Launch a Missile map game." />
		<meta name="theme-color" content="#101820" />
		<link rel="icon" href="assets/images/favicon.svg" type="image/svg+xml" />
		<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="anonymous" />
		<link rel="stylesheet" href="assets/css/main.css" />
		<link rel="stylesheet" href="assets/css/spacing.css?v=20260802-1" />
		<link rel="stylesheet" href="assets/css/portfolio.css?v=20260802-8" />
		<link rel="stylesheet" href="assets/css/fun.css?v=20260802-1" />
	</head>
	<body>
		<a class="skip-link" href="#game">Skip to game</a>

		<main id="game" class="game-shell">
			<a class="home-link" href="index.html" aria-label="Return to Matt Ferguson's portfolio">&larr; Portfolio</a>
			<h1 class="fun-title">Just for Fun</h1>

			<details class="fun-item astronaut-game">
				<summary>Astronaut Dressup</summary>
				<div class="puzzle-frame">
					<iframe src="games/dress-astronaut/index.html?v=20260802-18" title="Astronaut Dressup game" loading="lazy"></iframe>
				</div>
			</details>

			<details class="fun-item missile-game" hidden>
				<summary>Launch a Missile</summary>
				<section class="game-card" aria-label="Launch a Missile game">
					<div id="location-prompt" class="location-prompt">
						<button id="locate-button" type="button">Use My Location</button>
					</div>
					<p id="game-status" class="game-status" role="status" aria-live="polite"></p>
					<div id="map-stage" class="map-stage" hidden>
						<div id="missile-map" aria-label="Map showing the animated flight"></div>
						<div id="countdown" class="countdown" aria-hidden="true"></div>
					</div>
					<button id="replay-button" class="replay-button" type="button" hidden>Launch Again</button>
				</section>
			</details>

			<details class="fun-item galaxies-game">
				<summary>Galaxies</summary>
				<div class="puzzle-frame">
					<iframe src="games/galaxies/index.html?v=20260802-2" title="Galaxies puzzle" loading="lazy"></iframe>
				</div>
			</details>

			<details class="fun-item map-game">
				<summary>Map</summary>
				<div class="puzzle-frame">
					<iframe src="games/map/index.html?v=20260802-2" title="Map puzzle" loading="lazy"></iframe>
				</div>
			</details>

			<p class="puzzle-license"><a href="games/galaxies/LICENSE.txt">MIT License</a></p>
		</main>

		<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin="anonymous"></script>
		<script src="assets/js/fun.js?v=20260801-2"></script>
	</body>
</html>
